name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas, audit y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Prueba de humo del build (dist de la API)
        env:
          NODE_ENV: production
          AUDITOR_CONTACT_URL: https://auditor.example.com/contacto
          # Valores descartables solo para la prueba de humo (el hash es el de las pruebas).
          PUBLIC_ORIGIN: https://auditor.example.com
          ADMIN_EMAIL: humo@auditor.example.com
          ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$mjTw+dr2Sn7or4vymPkqiA$yTTupNIC30QzeCeZOSXZ9lIvAE5dnIuN2qOLYJ8hmIM'
          IP_HASH_SALT: sal-descartable-de-la-prueba-de-humo-0123
          DATABASE_PATH: ${{ runner.temp }}/smoke.db
          PORT: '3999'
        run: |
          node apps/api/dist/server.js &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3999/api/health

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t auditor-web-pyme:ci .
      - name: Prueba de humo de la imagen
        # Valores descartables solo para la prueba de humo (el hash es el de las pruebas).
        env:
          AUDITOR_CONTACT_URL: https://auditor.example.com/contacto
          PUBLIC_ORIGIN: https://auditor.example.com
          ADMIN_EMAIL: humo@auditor.example.com
          ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$mjTw+dr2Sn7or4vymPkqiA$yTTupNIC30QzeCeZOSXZ9lIvAE5dnIuN2qOLYJ8hmIM'
          IP_HASH_SALT: sal-descartable-de-la-prueba-de-humo-0123
        run: |
          docker run -d --name smoke -p 3000:3000 -e AUDITOR_CONTACT_URL -e PUBLIC_ORIGIN -e ADMIN_EMAIL -e ADMIN_PASSWORD_HASH -e IP_HASH_SALT auditor-web-pyme:ci
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:3000/api/health || { docker logs smoke; exit 1; }
          docker rm -f smoke

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas, audit y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Prueba de humo del build (dist de la API)
        env:
          NODE_ENV: production
          AUDITOR_CONTACT_URL: https://auditor.example.com/contacto
          # Valores descartables solo para la prueba de humo (el hash es el de las pruebas).
          PUBLIC_ORIGIN: https://auditor.example.com
          ADMIN_EMAIL: humo@auditor.example.com
          ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$mjTw+dr2Sn7or4vymPkqiA$yTTupNIC30QzeCeZOSXZ9lIvAE5dnIuN2qOLYJ8hmIM'
          IP_HASH_SALT: sal-descartable-de-la-prueba-de-humo-0123
          DATABASE_PATH: ${{ runner.temp }}/smoke.db
          PORT: '3999'
        run: |
          node apps/api/dist/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          PID=$!
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3999/api/health
          # La portada la sirve la misma API, con la CSP del documento.
          curl -fsS -D "$RUNNER_TEMP/headers.txt" http://127.0.0.1:3999/ | grep -q '<div id="root">'
          grep -qi "content-security-policy: default-src 'self'" "$RUNNER_TEMP/headers.txt"
          # Cierre limpio: SIGTERM y código de salida 0.
          kill -TERM "$PID"
          wait "$PID" || { echo "salida distinta de 0"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          grep -q '"msg":"cerrado"' "$RUNNER_TEMP/server.log"

  e2e:
    name: Pruebas e2e (Playwright, Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Sin red externa: el servidor de e2e usa un runAudit simulado.
      - run: pnpm test:e2e

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t auditor-web-pyme:ci .
      - name: Prueba de humo de la imagen
        # Valores descartables solo para la prueba de humo (el hash es el de las pruebas).
        env:
          AUDITOR_CONTACT_URL: https://auditor.example.com/contacto
          PUBLIC_ORIGIN: https://auditor.example.com
          ADMIN_EMAIL: humo@auditor.example.com
          ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=19456,t=2,p=1$mjTw+dr2Sn7or4vymPkqiA$yTTupNIC30QzeCeZOSXZ9lIvAE5dnIuN2qOLYJ8hmIM'
          IP_HASH_SALT: sal-descartable-de-la-prueba-de-humo-0123
          PORT: '10000'
        run: |
          docker run -d --name smoke -p 3000:10000 -e PORT -e AUDITOR_CONTACT_URL -e PUBLIC_ORIGIN -e ADMIN_EMAIL -e ADMIN_PASSWORD_HASH -e IP_HASH_SALT auditor-web-pyme:ci
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:3000/api/health || { docker logs smoke; exit 1; }
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">' || { docker logs smoke; exit 1; }
          # Corre como usuario no root y puede escribir la base (fallo típico del primer despliegue).
          test "$(docker exec smoke id -u)" != "0"
          docker exec smoke sh -c 'test -w /app/data && test -f /app/data/auditor.db'
          # Cierre limpio: docker stop manda SIGTERM; el proceso tiene que salir con 0.
          docker stop smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = "0" || { docker logs smoke; exit 1; }
          docker rm smoke

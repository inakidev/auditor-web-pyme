# Entorno local con la imagen de producción. Requiere un .env (ver .env.example).
services:
  api:
    build: .
    # Las variables van en .env. ADMIN_PASSWORD_HASH entre comillas simples (ver .env.example);
    # si en cambio lo escribís acá abajo en environment:, cada $ va como $$.
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/auditor.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - auditor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  auditor-data:
